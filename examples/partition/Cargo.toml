[package]
name = "partition"
version.workspace = true
edition.workspace = true

[dependencies]
wasm-shm = { workspace = true }

[build-dependencies]
symmetric-link-search = { workspace = true, optional = true }

[features]
default = ["canonical"]
canonical = ["wasm-shm/canonical"]
# native build: link against the pub-sub shared library (which implements the exchange)
symmetric = ["wasm-shm/symmetric", "dep:symmetric-link-search"]
