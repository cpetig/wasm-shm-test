[workspace]
resolver = "3"
members = ["complex/consumer", "complex/publisher", "complex/starter", "minimal/main", "minimal/impl", "partition"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
wasm-shm = { path = "../pub-sub/rust-client", default-features = false }
wasi-clocks = { path = "../pub-sub/wasi-clocks", default-features = false }
wit-bindgen = { path = "../wit-bindgen/crates/symmetric_executor/bindgen", package = "mini-bindgen", default-features = false, features = ["async"] }
futures = "0.3.31"
flat = { version = "0.1.0", path = "../flat-types-rust" }
# only used by the native (symmetric ABI) build
symmetric-link-search = { path = "../wit-bindgen/crates/symmetric_executor/link-search" }
