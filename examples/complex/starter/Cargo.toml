[package]
name = "starter"
version.workspace = true
edition.workspace = true

[dependencies]
wasm-shm = { workspace = true }
wit-bindgen = { workspace = true }
# native build: the other components are shared libraries to link against
publisher = { path = "../publisher", default-features = false, optional = true }
consumer = { path = "../consumer", default-features = false, optional = true }

[build-dependencies]
symmetric-link-search = { workspace = true, optional = true }
# built before the build script runs, so that it finds the libraries
publisher = { path = "../publisher", default-features = false, optional = true }
consumer = { path = "../consumer", default-features = false, optional = true }

[features]
default = ["canonical"]
canonical = ["wit-bindgen/canonical", "wasm-shm/canonical"]
symmetric = ["wit-bindgen/symmetric", "wasm-shm/symmetric", "dep:publisher", "dep:consumer", "publisher/symmetric", "consumer/symmetric", "dep:symmetric-link-search"]
