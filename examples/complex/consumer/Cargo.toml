[package]
name = "consumer"
version.workspace = true
edition.workspace = true

[dependencies]
wasm-shm = { workspace = true }
wit-bindgen = { workspace = true }
futures.workspace = true
flat = { workspace = true }

[build-dependencies]
symmetric-link-search = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib"]

[features]
default = ["canonical"]
canonical = ["wit-bindgen/canonical", "wasm-shm/canonical"]
symmetric = ["wit-bindgen/symmetric", "wasm-shm/symmetric", "dep:symmetric-link-search"]
