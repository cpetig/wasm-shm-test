[workspace]
resolver = "3"
members = ["rust-client", "wasi-clocks", "wasi-clocks/native", "test/publisher", "test/subscriber"]
# wasi-clocks/native only exists for the optional native (symmetric ABI) build;
# on wasm the host provides wasi:clocks
default-members = [".", "rust-client", "wasi-clocks", "test/publisher", "test/subscriber"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
wit-bindgen = { path = "../wit-bindgen/crates/symmetric_executor/bindgen", package = "mini-bindgen", default-features = false, features = ["async"] }
futures = "0.3.31"
# only used by the native (symmetric ABI) build
symmetric_executor = { path = "../wit-bindgen/crates/symmetric_executor" }
symmetric_stream = { path = "../wit-bindgen/crates/symmetric_executor/symmetric_stream" }
symmetric-link-search = { path = "../wit-bindgen/crates/symmetric_executor/link-search" }

# the pub-sub component: implements test:shm/pub-sub on top of the host's test:shm/exchange
[package]
name = "pub-sub"
version.workspace = true
edition.workspace = true

[dependencies]
futures.workspace = true
wit-bindgen = { workspace = true }
symmetric_executor = { workspace = true, optional = true }
symmetric_stream = { workspace = true, optional = true }

[build-dependencies]
symmetric-link-search = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib"]

[features]
default = ["canonical"]
# component model canonical ABI, for wasm32-wasip2
canonical = ["wit-bindgen/canonical"]
# build option: native shared library using the symmetric ABI, also implements test:shm/exchange
symmetric = ["dep:symmetric_executor", "dep:symmetric_stream", "dep:symmetric-link-search", "wit-bindgen/symmetric"]
